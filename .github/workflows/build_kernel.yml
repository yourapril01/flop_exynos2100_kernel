name: Kernel Build

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name (example: v1.0)"
        required: true
      release_name:
        description: "Release name"
        required: true
        default: "Automated Kernel Build"
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - model: exynos2100
            branch: Floppy_work
            variant: KSUNext-SUSFS
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ matrix.branch }}
        fetch-depth: 0
        submodules: recursive
        path: flopy2100

    - name: Update apt
      run: sudo apt-get update

    - name: Install dependencies
      run: |
        sudo apt-get install -y \
          build-essential openjdk-8-jdk maven cmake byacc flex automake libtool-bin \
          bison binutils-dev libiberty-dev zip unzip libncurses5-dev curl git ninja-build \
          python3 libssl-dev gcc-aarch64-linux-gnu cpio gawk libarchive-tools lz4 repo

    - name: Run kernel build
      working-directory: ./flopy2100
      run: |
        chmod +x ./do_build.sh
        ./do_build.sh

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.model }}-${{ matrix.branch }}-${{ matrix.variant }}
        path: flopy2100/build/out/Floppy_v1.1.2-${{ matrix.variant }}-${{ matrix.model }}-*.zip


  release:
    needs: build
    runs-on: ubuntu-24.04

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.tag_name }}
        name: ${{ github.event.inputs.release_name || github.ref_name }}
        files: artifacts/**/*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
