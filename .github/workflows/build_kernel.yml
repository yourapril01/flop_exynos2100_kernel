name: Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - model: exynos2100
            branch: Floppy_learn
            variant: KSUNext-SUSFS
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ matrix.branch }}
        fetch-depth: 0
        submodules: recursive
        path: flopy2100

    - name: Update apt
      run: sudo apt-get update

    - name: Install dependencies
      run: |
        sudo apt-get install -y \
          build-essential openjdk-8-jdk maven cmake byacc flex automake libtool-bin \
          bison binutils-dev libiberty-dev zip unzip libncurses5-dev curl git ninja-build \
          python3 libssl-dev gcc-aarch64-linux-gnu cpio gawk libarchive-tools lz4 repo

    - name: Run kernel build
      working-directory: ./flopy2100
      run: |
        chmod +x ./do_build.sh
        ./do_build.sh
      
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Floppy_v1.1.2-${{ matrix.model }}-${{ matrix.variant }}-${{ matrix.branch }}
        path: flopy2100/build/Floppy_v1.1.2-${{ matrix.variant }}-${{ matrix.model }}-*.zip
